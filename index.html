/* v0.2 – layered vector-art production pass */
.scene{background:#172734;border-color:#8f7955;isolation:isolate;box-shadow:inset 0 0 55px #060b12,0 0 24px #060c14}

.monster .art{height:83px;display:flex;align-items:center;justify-content:center}.monster .art img{max-width:84px;max-height:83px}
.shopitem .art{height:55px}.shopitem .art img{height:55px;width:65px;object-fit:contain}

/* Etapp 3: tydliga motattacker och unika specialeffekter */

.scene{--impact:#f6c46b}.scene.fx-fire{--impact:#ff642b}.scene.fx-dragon{--impact:#ff9b35}.scene.fx-lightning{--impact:#a5d9ff}.scene.fx-shadow{--impact:#b295ed}.scene.fx-curse{--impact:#8ae5cb}.scene.fx-quake{--impact:#e0b780}.scene.fx-thorns{--impact:#8fc76b}.scene.fx-stun{--impact:#f4b75b}

@media(prefers-reduced-motion:reduce){.scene.combat-impact,.scene.combat-impact:after,.battle-fx .burst,.scene.victory-glow .enemy{animation:none!important}.battle-fx .burst{opacity:1}}

/* v0.8: boss signatures, phase telegraph and elemental attack particles */
.boss-aura{position:absolute;left:68%;bottom:5%;width:24%;height:65%;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(ellipse,var(--boss-glow,#e9b66755),transparent 70%);filter:blur(8px);animation:boss-pulse 2.6s ease-in-out infinite alternate}

.boss-rune:before,.boss-rune:after{content:"";position:absolute;inset:12%;border:1px dashed currentColor;border-radius:50%}.boss-rune:after{inset:30%;border-style:solid}
.boss-aura.phase-two{animation:boss-enrage .7s ease-in-out infinite alternate}

.scene.fx-lightning .scene-fog{filter:brightness(2.4)}.scene.fx-shadow .scene-fog{background:#100f2bb0}.scene.fx-fire .scene-fog,.scene.fx-dragon .scene-fog{background:linear-gradient(0deg,#e7553d4d,transparent 75%)}

@media(prefers-reduced-motion:reduce){.boss-aura,.boss-rune,.boss-telegraph,.battle-fx .spark{animation:none!important}.battle-fx .spark{display:none}}

let defenseTimer=null;
function resolveDefense(blocked, submitted = false) {
  const defense = s.pendingDefense;
  if (!defense) return;
  clearInterval(defenseTimer);
  defenseTimer = null;
  document.getElementById('defense-modal')?.remove();
  s.lastQuestion = { a: defense.a, b: defense.b };
  s.pendingDefense = null;
  s.question = null;
  s.answer = '';
  if (submitted) recordMath(defense, blocked, false);

  let bonus = 0;
  if (blocked) {
    bonus = updateCombo(false);
    notice = '🛡️ Perfekt blockering! Ingen skada.';
    battleSound('guard');
  } else {
    actionSound('wrong');
    s.streak = 0;
    const shield = ITEMS.find(item => item.id === s.equipment.shield)?.block || 0;
    const damage = Math.max(1, defense.damage - shield);
    s.hp = Math.max(0, s.hp - damage);
    if (!s.hp) {
      loseBattle();
      return;
    }
    notice = defense.icon + ' ' + defense.name + ': −' + damage + ' HP.';
    if (s.battle) {
      s.battle.lastAttack = { name: defense.name, icon: defense.icon, effect: defense.effect, damage };
    }
  }
  if (s.battle?.move) chooseQuestion();
  save();
  render();
  if (blocked) {
    combatFx('guard', null, null);
    correctReward('block', false, bonus);
  } else {
    animateCounter();
  }
}

function defenseKey(key) {
  const defense = s.pendingDefense;
  if (!defense) return;
  if (Date.now() >= defense.deadline) {
    resolveDefense(false);
    return;
  }
  if (key === '✓') {
    if (defense.answer) resolveDefense(Number(defense.answer) === defense.a * defense.b, true);
    return;

  if (key === '⌫') defense.answer = defense.answer.slice(0, -1);
  else if (defense.answer.length < 3) defense.answer += key;
  document.getElementById('defense-answer').textContent = defense.answer || '＿';
}

const BOSS_ENTRANCE_TONES = [
  [155, 69, 'triangle'],  // Goblinkungen: klubban
  [330, 110, 'square'],   // Benkaptenen: rasslande ben
  [92, 36, 'sine'],       // Stengolemen: skalv
  [210, 56, 'triangle'],  // Mossatrollet: dovt morr

function encounterSound(boss, world) {
  if (!s.sound) return;
  unlockAudio();
  if (!audioCtx) return;
  try {
    const ctx = audioCtx;
    const now = ctx.currentTime;
    const tone = (from, to, delay, duration, volume, wave) => {
      const start = now + delay;
      const oscillator = ctx.createOscillator(), gain = ctx.createGain();
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(from, start);
      oscillator.frequency.exponentialRampToValueAtTime(to, start + duration);
      gain.gain.setValueAtTime(.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + .025);
      gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration);
    };
    const impact = boss ? .72 : .38;
    const duration = boss ? .43 : .22;
    const grit = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * duration), ctx.sampleRate);
    const samples = grit.getChannelData(0);
    // A small deterministic noise burst leaves gameplay randomness untouched.
    let seed = 17;
    for (let i = 0; i < samples.length; i++) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      samples[i] = seed / 2147483648 - 1;
    }
    const burst = ctx.createBufferSource(), filter = ctx.createBiquadFilter(), envelope = ctx.createGain();
    burst.buffer = grit;
    filter.type = 'lowpass';
    filter.frequency.value = boss ? 760 : 1900;
    envelope.gain.setValueAtTime(.12, now + impact);
    envelope.gain.exponentialRampToValueAtTime(.0001, now + impact + duration);
    burst.connect(filter);
    filter.connect(envelope);
    envelope.connect(ctx.destination);
    burst.start(now + impact);
    if (boss) {
      const [from,to,wave] = BOSS_ENTRANCE_TONES[world];
      tone(65, 48, .03, .64, .12, 'sine');
      tone(from, to, impact, .69, .075, wave);
      tone(78, 34, impact, .48, .17, 'sine');
    } else {
      tone(330, 214, .04, .25, .07, 'triangle');
      tone(188, 107, impact, .27, .10, 'triangle');
    }
  } catch {}
}

function factWeight(a, b, mode, hard) {
  const stat = factStats(a, b);
  const level = factLevel(a, b);
  const age = (Date.now() - Date.parse(stat.lastPracticed)) / 86400000;
  const due = level >= 2 && age >= 3 ? 3 : level === 1 && age >= 1 ? 2 : 0;
  const errors = Math.min(6, stat.errors || 0);
  const recentMisses = Math.min(3, stat.recentMisses ?? (stat.lastWrong ? 1 : 0));
  let weight = (mode === 'travel' ? [7, 5, 3, 1] : [8, 5, 2, 1])[level] + due;
  weight += errors * (mode === 'travel' ? 1 : 3);
  weight += recentMisses * (mode === 'travel' ? 4 : 14);
  if (mode === 'boss' && hard.includes(b)) weight += 10;
  return weight;
}

function nextFact(mode) {
  const { n: a, hard } = WORLDS[s.world];
  const last = s.lastQuestion || s.question;
  const allowed = FACTORS.filter(b => !last ||
    !(last.a === a && last.b === b || last.a === b && last.b === a));
  const bossFacts = allowed.filter(b => hard.includes(b) || factStats(a, b).errors > 0);
  const options = mode === 'boss' && bossFacts.length ? bossFacts : allowed;
  const weights = options.map(b => factWeight(a, b, mode, hard));
  let roll = Math.random() * weights.reduce((sum, weight) => sum + weight, 0);
  const index = weights.findIndex(weight => (roll -= weight) < 0);
  const question = { a, b: options[index < 0 ? options.length - 1 : index] };
  s.lastQuestion = question;
  return question;
}

function chooseQuestion() {
  const mode = s.battle?.boss ? 'boss' : s.battle || s.chest ? 'battle' : 'travel';
  s.question = nextFact(mode);
  s.answer = '';

  save();
}

const GEAR_FIND_STEPS = [2, 3, 5, 7, 9, 10, 11];

function planGearFind() {
  if (s.gearRoute?.world === s.world || s.gearFinds.includes(s.world)) return;
  const remaining = GEAR_FIND_STEPS.filter(step => step > s.step);
  const step = remaining.length && Math.random() < GEAR_FIND_CHANCE
    ? remaining[Math.floor(Math.random() * remaining.length)] : null;
  s.gearRoute = { world: s.world, step };
}

function gearStrength(item) {
  return item.damage || item.hp || item.block;
}

function offerGearFind() {
  if (s.gearRoute?.step !== s.step || s.gearFinds.includes(s.world)) return;
  const owned = ITEMS.filter(item => s.inventory.includes(item.id));
  const eligible = ITEMS.filter(item => item.world <= s.world && item.world >= s.world - 1 &&
    !owned.some(other => other.slot === item.slot && gearStrength(other) >= gearStrength(item)));
  const weighted = eligible.flatMap(item => Array(item.world === s.world ? 4 : 1).fill(item));
  if (!weighted.length) return;
  const item = weighted[Math.floor(Math.random() * weighted.length)];
  s.event = { type: 'gear-offer', item: item.id };
}

function gearKey(key) {

    stopGearChallenge(false);

  if (key === '✓') {
    if (!challenge.answer) return;
    const correct = Number(challenge.answer) === challenge.question.a * challenge.question.b;
    recordMath(challenge.question, correct, false);
    let bonus = 0;
    if (correct) {
      challenge.correct++;
      bonus = updateCombo(false);
    } else {

    if (challenge.correct === GEAR_QUESTIONS) {

function victoryFlight(source, target, symbol, delay) {

    particle.style.top = startY + 'px';
    particle.style.setProperty('--flight-x', (end.left + end.width / 2 - startX - (i - 2) * 8) + 'px');
    particle.style.setProperty('--flight-y', (end.top + end.height / 2 - startY) + 'px');
    particle.style.animationDelay = delay + i * 50 + 'ms';
    document.body.appendChild(particle);
    setTimeout(() => particle.remove(), delay + 800);

function collectVictory(dialog, event, reward) {
  if (s.event !== event) return;
  unlockAudio();
  const gold = dialog.querySelector('[data-victory-reward="gold"]').getBoundingClientRect();
  const xp = dialog.querySelector('[data-victory-reward="xp"]').getBoundingClientRect();
  dialog.remove();
  s.event = null;
  notice = '';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  collectingVictory = reduceMotion ? null : reward.before;
  render();

    actionSound('collect');
    return;
  }

  const targets = { gold: document.getElementById('hud-gold'), xp: document.getElementById('hud-xp') };
  victoryFlight(gold, targets.gold, '🪙', 0);
  victoryFlight(xp, targets.xp, '⭐', 85);
  actionSound('collect', .42);
  busy = true;
  const start = performance.now();
  const before = reward.before;
  const tick = now => {
    const goldPart = Math.max(0, Math.min(1, (now - start - 400) / 350));
    const xpPart = Math.max(0, Math.min(1, (now - start - 485) / 350));
    if (before) {
      let level = before.level, progress = before.xp + Math.floor(reward.xp * xpPart);
      while (progress >= xpToNextLevel(level)) {
        progress -= xpToNextLevel(level);
        level++;
      }
      document.getElementById('hud-level').textContent = 'Nivå ' + level;
      targets.gold.textContent = '🪙 ' + (before.gold + Math.floor(reward.gold * goldPart));
      targets.xp.textContent = '⭐ ' + progress + ' XP';
    }
    if (xpPart < 1) {
      requestAnimationFrame(tick);
      return;
    }
    collectingVictory = null;
    busy = false;
    renderHud();

function recordMath(question, correct, assisted) {
  const key = question.a + 'x' + question.b;
  const stat = s.math[key] || { right: 0, independent: 0, level: 0, days: [], errors: 0 };
  const now = new Date().toISOString();
  stat.lastPracticed = now;
  stat.lastWrong = !correct;
  if (correct) {
    stat.right++;
    if (!assisted) {
      stat.independent++;
      stat.recentMisses = 0;
      const day = now.slice(0, 10);
      if (!stat.days.includes(day)) stat.days.push(day);
    }
    stat.level = stat.independent >= 5 && stat.days.length >= 2 ? 3 : stat.independent >= 3 ? 2 : 1;
    s.stats[assisted ? 'assisted' : 'correct']++;
  } else {
    stat.errors = (stat.errors || 0) + 1;
    stat.recentMisses = Math.min(3, (stat.recentMisses || 0) + 1);
  }
  s.math[key] = stat;
}

function updateCombo(assisted) {
  if (assisted) {
    s.streak = 0;
    return 0;
  }
  s.streak = (s.streak || 0) + 1;
  s.bestStreak = Math.max(s.bestStreak || 0, s.streak);
  if (s.streak % COMBO_SIZE) return 0;
  s.gold += COMBO_REWARD;
  xp(COMBO_REWARD);
  return COMBO_REWARD;
}

function monsterCounterattack(battle) {
  const damage = Math.max(0, battle.damage - (battle.guard || 0));
  battle.guard = 0;
  s.hp = Math.max(0, s.hp - damage);
  battle.lastAttack = { name: 'Motattack', icon: '💥', effect: '', damage };
  return damage ? 'Fienden slog tillbaka: −' + damage + ' HP.' : 'Du blockerade attacken!';
}

function wrongAnswer(battle) {
  s.streak = 0;
  s.answer = '';
  s.question = null;
  notice = 'Försök igen med ett annat tal. Du kan använda en ledtråd.';
  actionSound('wrong');
  if (battle?.boss) {
    notice = bossCounterattack(battle, 'wrong');
  } else {
    if (battle) {
      notice = monsterCounterattack(battle) + ' ' + notice;
      if (!s.hp) {
        loseBattle();
        return;
      }
    }
    chooseQuestion();
  }
  save();
  render();
  if (battle?.boss) showDefense();
  else if (battle) animateCounter();
  else wrongFeedback();
}

function correctTravel(assisted, bonus) {
  if (!s.chest) {
    if (!doStep(assisted, bonus)) correctReward('travel', assisted, bonus);
    return;
  }
  const {gold, xp: earned} = worldBalance(s.world).chest;
  s.gold += gold;
  xp(earned);
  s.rewarded.push('chest-' + s.chest.world);
  s.chest = null;
  s.question = null;
  s.answer = '';
  s.mistakes = 0;
  s.hint = false;
  s.event = { type: 'chest', title: '🎁 Kistan öppnades!', body: 'Rätt svar! Du fick '+gold+' guld och '+earned+' XP.' };
  save();
  render();
  showPendingEvent();
  correctReward('chest', assisted, bonus);
}

function correctBattle(battle, assisted, bonus) {
  const action = battle.move;
  if (action === 'power' && ++battle.pending < 2) {
    s.question = null;
    s.answer = '';
    notice = 'Ett rätt svar kvar till kraftattacken.';
    if (battle.boss) bossCounterattack(battle, 'charge');
    else chooseQuestion();
    save();
    render();
    correctReward('charge', assisted, bonus);
    if (battle.boss) setTimeout(showDefense, 650);
    return;
  }

  let damage = action === 'power' ? powerDamage() : dmg();
  if (assisted) damage = Math.max(8, damage - 5);
  const inflicted = Math.min(battle.hp, damage);
  battle.hp -= inflicted;
  s.question = null;
  s.answer = '';
  battle.move = null;
  battle.pending = 0;
  const defeated = battle.hp === 0;
  if (!defeated) {
    battle.round = (battle.round || 0) + 1;
    notice = '';
    if (battle.boss && battle.phase === 1 && battle.hp <= battle.maxHp / 2) {
      battle.phase = 2;
      battle.damage += BOSS_PHASE_DAMAGE;
      notice = '🔥 Fas 2! ' + battle.name + ' får en ny specialattack. ';
      battleSound('phase');
    }
    notice += battle.boss ? bossCounterattack(battle, 'turn') : monsterCounterattack(battle);
    if (!s.hp) {
      loseBattle();
      return;
    }
  }

  busy = true;
  save();
  render();
  correctReward(action === 'power' ? 'power' : 'hit', assisted, bonus, inflicted);
  document.getElementById('hero')?.classList.add('hit');
  document.getElementById('enemy')?.classList.add('hurt');
  combatFx('hero', { icon: action === 'power' ? '💥⚔️' : '⚔️' }, inflicted);
  battleSound(action === 'power' ? 'power' : 'hit');
  setTimeout(() => {
    if (s.battle !== battle) {
      busy = false;
      return;
    }
    if (defeated) {
      combatFx('victory', null, null);
      document.getElementById('enemy')?.classList.add('dead');
      battleSound('victory');
      setTimeout(() => {
        busy = false;
        if (s.battle === battle) winBattle();
      }, 850);
      return;
    }
    busy = false;
    if (battle.boss) showDefense();
    else animateCounter();
  }, 850);
}

function answer() {
  if (busy || encounterActive() || s.event || s.pendingDefense || s.gearChallenge || !s.question || !s.answer) return;
  const battle = s.battle;
  if (s.phase === 'battle' && !battle?.move) return;
  const question = s.question;
  const correct = Number(s.answer) === question.a * question.b;
  const assisted = s.hint || s.mistakes > 0;
  s.lastQuestion = question;
  recordMath(question, correct, assisted);
  if (!correct) {
    wrongAnswer(battle);
    return;
  }
  const bonus = updateCombo(assisted);
  if (s.phase === 'travel') correctTravel(assisted, bonus);
  else correctBattle(battle, assisted, bonus);
}
function winBattle() {
  const battle = s.battle;
  if (!battle) return;
  const before = { gold: s.gold, xp: s.xp, level: s.level };
  const newCard = !s.cards.includes(battle.card);
  const world = s.world;
  const monster = MONSTERS.find(item => item.id === battle.card);
  let collectionBonus = false;
  if (newCard) {
    s.cards.push(battle.card);
    s.collectionRewards ??= [];
    if (monster && !s.collectionRewards.includes(monster.world) &&
        MONSTERS.filter(item => item.world === monster.world).every(item => s.cards.includes(item.id))) {
      s.collectionRewards.push(monster.world);
      collectionBonus = true;
      s.gold += 75;
      xp(50);
    }
  }
  const balance = worldBalance(world);
  const earned = battle.boss ? balance.boss : balance.monster;
  s.gold += earned.gold;
  xp(earned.xp);
  s.battle = null;
  s.phase = 'travel';
  s.question = null;
  s.hp = Math.min(maxHp(), s.hp + balance.heal);
  s.event = {
    type: 'victory',
    title: battle.boss ? '🏆 ' + WORLDS[world].boss + ' besegrad!' : '⚔️ Monster besegrat!',
    card: newCard ? battle.card : null, monster: battle.card, collectionBonus,
    reward: { gold: earned.gold + (collectionBonus ? 75 : 0), xp: earned.xp + (collectionBonus ? 50 : 0), before },
    body: battle.boss ? (world < WORLDS.length - 1 ? 'Nästa värld upplåst!' : 'Du räddade riket!') : ''
  };
  if (battle.boss) {
    if (!s.cleared.includes(world)) s.cleared.push(world);
    s.step = 0;
    s.gearRoute = null;
    if (world < WORLDS.length - 1) s.world++;
    screen = 'map';
  }
  save();
  render();
  showPendingEvent();
}
function move(action) {
  if (!s.battle || encounterActive() || busy || s.event || s.pendingDefense || s.gearChallenge || s.battle.pending) return;
  s.battle.move = action;
  if (!s.question) chooseQuestion();
  notice = action === 'power' ? 'Två rätta svar laddar kraftattacken.' : 'Lös ett tal för att attackera.';
  save();
  render();
}
function key(k){if(busy||encounterActive()||s.event||s.pendingDefense||s.gearChallenge)return;if(k==='✓'){answer();return}if(k==='⌫')s.answer=s.answer.slice(0,-1);else if(s.answer.length<3)s.answer+=k;save();render()}
function exportSave(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='multiplikationsriket-sparfil.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('click',e=>{unlockAudio();if(busy||s.pendingDefense||s.gearChallenge)return;let b=e.target.closest('[data-nav],[data-world],[data-key],[data-move],[data-buy],[data-equip],[data-action],[data-card]');if(!b)return;if(b.dataset.nav){screen=b.dataset.nav;notice='';render();if(screen==='game')recoverGame()}else if(b.dataset.world!==undefined){let i=Number(b.dataset.world);if(i===0||s.cleared.includes(i-1)){selectedMapWorld=i;render()}}else if(b.dataset.card){let m=MONSTERS.find(x=>x.id===Number(b.dataset.card));if(m&&s.cards.includes(m.id))modal('📖 '+m.name,'Kort #'+m.id+' · '+rarity(m.id)+' · '+WORLDS[m.world].name+' · '+m.hp+' HP',()=>{});}else if(b.dataset.key)key(b.dataset.key);else if(b.dataset.move)move(b.dataset.move);else if(b.dataset.buy){let i=ITEMS.find(x=>x.id===b.dataset.buy);if(i&&itemAvailable(i)&&s.gold>=i.price&&!s.inventory.includes(i.id)){s.gold-=i.price;s.inventory.push(i.id);equipItem(i);save();render()}}else if(b.dataset.equip){let i=ITEMS.find(x=>x.id===b.dataset.equip);if(i&&s.inventory.includes(i.id)){equipItem(i);save();render()}}else if(b.dataset.action==='hint'){s.hint=true;notice='Du kan använda upprepad addition.';save();render()}else if(b.dataset.action==='sound'){s.sound=!s.sound;save();render();if(s.sound){unlockAudio();actionSound('reward')}}else if(b.dataset.action==='test-sound'){testAudio()}else if(b.dataset.action==='play-selected-world'){let i=selectedMapWorld===null?s.world:selectedMapWorld;if(i===0||s.cleared.includes(i-1)){if(i!==s.world){s.world=i;s.step=0;s.event=null;s.chest=null;s.gearRoute=null;s.phase='travel';s.battle=null;s.question=null;save()}selectedMapWorld=null;screen='game';notice='';render();recoverGame()}}else if(b.dataset.action==='export')exportSave();else if(b.dataset.action==='reset'){if(confirm('Vill du verkligen radera alla framsteg?')){s=fresh();save();screen='home';render()}}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{let imported=JSON.parse(await e.target.files[0].text());if(imported.version!==1||!Array.isArray(imported.cards)||!Array.isArray(imported.cleared)||!imported.math||!Number.isInteger(imported.world)||imported.world<0||imported.world>7)throw Error('Fel format');if(confirm('Ersätt dina nuvarande framsteg med sparfilen?')){s={...fresh(),...imported};save();screen='home';render()}}catch{alert('Kunde inte läsa sparfilen.')}});
function syncVisibleViewport(){const h=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--visible-height',h+'px')}syncVisibleViewport();window.visualViewport?.addEventListener('resize',syncVisibleViewport);window.addEventListener('orientationchange',()=>{syncVisibleViewport();fitGameViewport()});window.visualViewport?.addEventListener('resize',fitGameViewport);
render();if(s.gearChallenge)showGearChallenge();else if(s.pendingDefense)showDefense();else if(s.event)showPendingEvent();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
